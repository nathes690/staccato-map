<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STACCATO Study Sites</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  .staccato-map-wrap {
    --ink:#1a2b3c; --muted:#5a6b7b; --line:#d9e1e8;
    --us:#2563eb; --tw:#0d9488; --th:#c2410c;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    max-width: 1000px;
    margin: 0 auto;
    padding: 16px;
  }
  .staccato-map-wrap * { box-sizing: border-box; }
  .staccato-map-head { border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:16px; }
  .staccato-map-head h2 { margin:0 0 4px; font-size:1.45rem; letter-spacing:0.5px; }
  .staccato-map-head p { margin:0; color:var(--muted); font-size:0.92rem; font-style:italic; }
  #staccato-map { height:520px; width:100%; border:1px solid var(--line); border-radius:6px; z-index:0; }
  .staccato-legend { display:flex; flex-wrap:wrap; gap:18px; margin:14px 0 0; font-size:0.9rem; }
  .staccato-legend span { display:inline-flex; align-items:center; gap:7px; color:var(--muted); }
  .staccato-legend i { width:13px; height:13px; border-radius:50%; display:inline-block; border:2px solid rgba(0,0,0,0.15); }
  .staccato-pop { font-family:Georgia, serif; min-width:200px; }
  .staccato-pop .site { font-weight:bold; font-size:1rem; margin:0 0 2px; }
  .staccato-pop .loc  { color:#5a6b7b; font-size:0.82rem; margin:0 0 8px; }
  .staccato-pop .pi   { font-size:0.9rem; margin:0; }
  .staccato-pop .role { color:#5a6b7b; font-size:0.8rem; font-style:italic; margin:2px 0 0; }
  .staccato-pop .cc { display:inline-block; margin-top:7px; font-size:0.7rem; letter-spacing:0.5px; text-transform:uppercase; background:#1a2b3c; color:#fff; padding:2px 7px; border-radius:3px; }
  .leaflet-tooltip.staccato-tip { font-family:Georgia, serif; font-weight:bold; font-size:0.85rem; border-color:var(--line); }
</style>
</head>
<body>
<div class="staccato-map-wrap">
  <div class="staccato-map-head">
    <h2>STACCATO Study Sites</h2>
    <p>An international, multi-site randomized clinical trial across the United States, Taiwan, and Thailand. Hover a marker for the site name; click for the principal investigator.</p>
  </div>
  <div id="staccato-map"></div>
  <div class="staccato-legend">
    <span><i style="background:#2563eb"></i> United States</span>
    <span><i style="background:#0d9488"></i> Taiwan</span>
    <span><i style="background:#c2410c"></i> Thailand</span>
  </div>
</div>

<script>
(function () {
  var sites = [
    { country:"us", site:"UCSF — Francis I. Proctor Foundation", loc:"San Francisco, California, USA",
      pi:"John Gonzales, MD", role:"Principal Investigator · Clinical &amp; Data Coordinating Center",
      coord:true, lat:37.7679, lng:-122.3899 },
    { country:"us", site:"UCLA — Stein Eye Institute", loc:"Los Angeles, California, USA",
      pi:"Edmund Tsui, MD", role:"Site Principal Investigator", lat:34.0665, lng:-118.4456 },
    { country:"tw", site:"Chang Gung Memorial Hospital", loc:"Taoyuan, Taiwan",
      pi:"Yih-Shiou Hwang, MD, PhD", role:"Site Principal Investigator", lat:25.0610, lng:121.3850 },
    { country:"th", site:"Chulalongkorn University", loc:"King Chulalongkorn Memorial Hospital, Bangkok, Thailand",
      pi:"Assoc. Prof. Thanapong Somkijrungroj, MD", role:"Site PI · Head, Uveitis Unit", lat:13.7325, lng:100.5331 },
    { country:"th", site:"Khon Kaen University", loc:"Khon Kaen, Thailand",
      pi:"Wipada Laovirojjanakul, MD", role:"Site Principal Investigator", lat:16.4756, lng:102.8249 },
    { country:"th", site:"Chiang Mai University", loc:"Chiang Mai, Thailand",
      pi:"Prof. Kessara Pathanapitoon, MD", role:"Site Principal Investigator", lat:18.7956, lng:98.9536 }
  ];
  var colors = { us:"#2563eb", tw:"#0d9488", th:"#c2410c" };
  var map = L.map("staccato-map", { scrollWheelZoom:false, worldCopyJump:true }).setView([28,80], 3);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:"abcd", maxZoom:19
  }).addTo(map);
  var bounds = [];
  sites.forEach(function (s) {
    var c = colors[s.country];
    var m = L.circleMarker([s.lat, s.lng], {
      radius: s.coord ? 11 : 9, fillColor:c, color:"#fff", weight:2, fillOpacity:0.95
    }).addTo(map);
    m.bindTooltip(s.site, { className:"staccato-tip", direction:"top", offset:[0,-6] });
    m.bindPopup(
      '<div class="staccato-pop">' +
        '<p class="site">' + s.site + '</p>' +
        '<p class="loc">' + s.loc + '</p>' +
        '<p class="pi"><b>' + s.pi + '</b></p>' +
        '<p class="role">' + s.role + '</p>' +
        (s.coord ? '<span class="cc">Coordinating Center</span>' : '') +
      '</div>');
    bounds.push([s.lat, s.lng]);
  });
  map.fitBounds(bounds, { padding:[50,50] });

  // Tell the parent Drupal page how tall we are, so the iframe can auto-size.
  function reportHeight() {
    var h = document.body.scrollHeight;
    if (window.parent) window.parent.postMessage({ staccatoMapHeight: h }, "*");
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  setTimeout(reportHeight, 600);
})();
</script>
</body>
</html>
